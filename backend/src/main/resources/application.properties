# ============ HTTP ============
quarkus.http.port=8080

# ============ SQLite 数据源 ============
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
# SQLite 为单文件库，全局只允许一个写者：连接池收敛为单连接，所有事务串行执行，
# 从根上消除 SQLITE_BUSY / BUSY_SNAPSHOT；busy_timeout 作为兜底
quarkus.datasource.jdbc.url=jdbc:sqlite:./rescue.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.acquisition-timeout=30S

# ============ Hibernate ORM ============
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
# 建表由 SchemaInit 启动时执行 schema.sql 完成（避免 SQLite 多连接 DDL/种子快照冲突）
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ============ JSON 时间格式 ============
quarkus.jackson.write-dates-as-timestamps=false

# ============ 日志 ============
quarkus.log.level=INFO
quarkus.log.category."com.elevator".level=INFO
