# HTTP
quarkus.http.port=8080

# SQLite 数据源（单连接，避免 SQLite 写锁竞争）
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/rescue.db?busy_timeout=5000
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=1

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# 业务参数
# 维保到场 SLA（分钟），分派时可用 etaMinutes 覆盖
rescue.maintenance-sla-min=30
# 定时检查维保迟到的周期
rescue.late-check.every=15s

quarkus.log.category."com.elevator.rescue".level=INFO
quarkus.banner.enabled=false
